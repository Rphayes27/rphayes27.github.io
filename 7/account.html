<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">

        <meta content="width=device-width, initial-scale=1.0" name="viewport">

        <meta content="Rebecca Hayes" name="author">

        <title>Your Account | The Threat of Extinction</title>

        <link href="style.css?v=stage4-modal-1" rel="stylesheet">

    </head>

    <body class="contact-page" data-protected="true">
        <header>
            <nav aria-label="Main navigation" class="navbar">
                <a class="website-name" href="index.html">The Threat of Extinction</a>
                <ul class="nav-links">
                    <li>
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="choice.html">Explore</a>
                    </li>

                    <li>
                        <a href="static.html">Animal Directory</a>
                    </li>

                    <li>
                        <a href="contact.html">Contact Us</a>
                    </li>

                    <li class="nav-guest">
                        <button class="nav-button nav-login-button" data-open-login type="button">Log In / Sign Up</button>
                    </li>

                    <li class="nav-user" hidden="">
                        <a href="account.html">Account</a>
                    </li>

                    <li class="nav-user" hidden="">
                        <button class="nav-button" id="logout-button" type="button">Log Out</button>
                    </li>
                </ul>

                <span aria-live="polite" class="nav-message" id="nav-message" role="status"></span>
            </nav>
        </header>

        <main class="contact-information">
            <section class="contact-introduction">
                <h1>Your Account</h1>

                <p>Signed in as <strong id="account-email">Loading...</strong></p>

                <p>
                    Change your password below. You'll need your current password.
                </p>
            </section>

            <section class="contact-card">
                <h2>Change Password</h2>

                <form class="contact-form" id="password-form">
                    <div class="form-group">
                        <label for="current-password">Current Password</label>
                        <input autocomplete="current-password" id="current-password" required="" type="password">
                    </div>

                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input autocomplete="new-password" id="new-password" minlength="6" required="" type="password">
                    </div>

                    <div class="form-group">
                        <label for="confirm-new-password">Confirm New Password</label>
                        <input autocomplete="new-password" id="confirm-new-password" minlength="6" required="" type="password">
                    </div>

                    <button class="contact-button" type="submit">Update Password</button>
                </form>

                <p aria-live="polite" class="form-message" id="password-message" role="status"></p>
            </section>
        </main>

        <footer>
            <p>
                The Threat of Extinction
            </p>
        </footer>

                <dialog aria-describedby="login-dialog-message" aria-labelledby="login-dialog-title" class="login-required-dialog" id="login-required-dialog">
            <section id="login-dialog-prompt">
                <h2 id="login-dialog-title">Login Required</h2>

                <p id="login-dialog-message">
                    You must log in to continue.
                </p>

                <div class="login-dialog-actions">
                    <button class="dialog-cancel-button" id="dialog-cancel-button" type="button">Not Now</button>

                    <button class="dialog-login-button" id="dialog-login-button" type="button">Log In / Sign Up</button>
                </div>
            </section>

            <section id="auth-dialog-panel" hidden>
                <h2 id="auth-dialog-title">Log In</h2>

                <div class="auth-dialog-tabs" role="group" aria-label="Choose login or signup">
                    <button class="auth-tab-button active" id="auth-login-tab" type="button">Log In</button>

                    <button class="auth-tab-button" id="auth-signup-tab" type="button">Sign Up</button>
                </div>

                <form class="contact-form auth-dialog-form" id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>

                        <input autocomplete="email" id="login-email" required type="email">
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>

                        <input autocomplete="current-password" id="login-password" required type="password">
                    </div>

                    <button class="contact-button" type="submit">Log In</button>
                </form>

                <form class="contact-form auth-dialog-form" id="signup-form" hidden>
                    <div class="form-group">
                        <label for="signup-email">Email</label>

                        <input autocomplete="email" id="signup-email" required type="email">
                    </div>

                    <div class="form-group">
                        <label for="signup-password">Password (at least 6 characters)</label>

                        <input autocomplete="new-password" id="signup-password" minlength="6" required type="password">
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>

                        <input autocomplete="new-password" id="confirm-password" minlength="6" required type="password">
                    </div>

                    <button class="contact-button" type="submit">Create Account</button>
                </form>

                <p aria-live="polite" class="form-message" id="auth-dialog-message" role="status"></p>

                <div class="auth-dialog-actions">
                    <button class="dialog-cancel-button" id="auth-back-button" type="button">Back</button>

                    <button class="dialog-cancel-button" id="auth-close-button" type="button">Cancel</button>
                </div>
            </section>
        </dialog>

        <script src="js/account.js?v=stage4-2" type="module"></script>

        <script src="js/site.js?v=stage4-modal-1" type="module"></script>
    </body>
</html>
