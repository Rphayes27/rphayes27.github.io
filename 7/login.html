<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta name="author" content="Rebecca Hayes">

        <title>Log In or Sign Up | The Threat of Extinction</title>

        <link rel="stylesheet" href="style.css?v=stage4-single">

    </head>

    <body class="contact-page">
        <header>
            <nav class="navbar" aria-label="Main navigation">
                <a class="website-name" href="index.html">The Threat of Extinction</a>
                <ul class="nav-links">
                    <li>
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="login.html" aria-current="page">Log In / Sign Up</a>
                    </li>
                </ul>
            </nav>
        </header>

        <main class="contact-information">
            <section class="contact-introduction">
                <h1>Welcome!</h1>

                <p id="login-required" class="login-required-message" role="status" aria-live="polite" hidden="">
                    You need to log in to continue.
                </p>

                <p>
                    Log in or create an account to explore endangered wildlife.
                </p>

                <p id="signed-in-notice" class="form-message" role="status" hidden=""></p>
            </section>

            <div class="account-forms">
                <section class="contact-card">
                    <h2>Log In</h2>

                    <form id="login-form" class="contact-form">
                        <div class="form-group">
                            <label for="login-email">Email</label>
                            <input type="email" id="login-email" autocomplete="email" required="">
                        </div>

                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" autocomplete="current-password" required="">
                        </div>

                        <button type="submit" class="contact-button">Log In</button>
                    </form>

                    <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
                </section>

                <section class="contact-card">
                    <h2>Create an Account</h2>

                    <form id="signup-form" class="contact-form">
                        <div class="form-group">
                            <label for="signup-email">Email</label>
                            <input type="email" id="signup-email" autocomplete="email" required="">
                        </div>

                        <div class="form-group">
                            <label for="signup-password">Password (at least six characters)</label>
                            <input type="password" id="signup-password" autocomplete="new-password" minlength="6" required="">
                        </div>

                        <div class="form-group">
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" id="confirm-password" autocomplete="new-password" minlength="6" required="">
                        </div>

                        <button type="submit" class="contact-button">Sign Up</button>
                    </form>

                    <p id="signup-message" class="form-message" role="status" aria-live="polite"></p>
                </section>
            </div>
        </main>

        <footer>
            <p>
                The Threat of Extinction
            </p>
        </footer>

        <script type="module">
            import("./js/auth.js?v=stage4-2").catch(() => {
            document.getElementById("login-message").textContent =
            "The login service could not load. Check your connection and Firebase setup.";
            document.getElementById("login-message").classList.add("error-message");
            });
            
        </script>
    </body>
</html>
